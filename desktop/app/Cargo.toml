[package]
name = "ceviri-app"
description = "Masaüstü uygulaması (Tauri): Mac + Windows"
edition.workspace = true
version.workspace = true

[[bin]]
name = "anlik-ceviri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ceviri-core.workspace = true
ceviri-engine.workspace = true
ceviri-opus.workspace = true
ceviri-platform.workspace = true
ceviri-tvsetup.workspace = true
serde.workspace = true
serde_json.workspace = true
# macos-private-api: şeffaf overlay penceresi için (yalnızca Mac App Store dağıtımını engeller).
tauri = { version = "2", features = ["macos-private-api"] }

[dev-dependencies]
tungstenite = "0.30"
