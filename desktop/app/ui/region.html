<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Anlık Çeviri bölge seçimi</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Oyun görünsün ama karartılsın; tamamen şeffaf pikseller tıklamayı kaçırabilir. */
      background: rgba(0, 0, 0, 0.45);
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #fff;
    }

    .help {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      box-sizing: border-box;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(10, 12, 16, 0.9);
      font-size: 15px;
      line-height: 1.45;
      text-align: center;
      cursor: default;
      pointer-events: auto;
    }

    .help strong { display: block; font-size: 17px; margin-bottom: 4px; }
    .help kbd { font-family: inherit; font-size: 12px; padding: 1px 6px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.35); }
    .help .buttons { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }

    .help button {
      font: inherit;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      cursor: pointer;
    }

    .help button:hover { background: rgba(255, 255, 255, 0.18); }

    /* Seçilen alan: karartma delinmiş gibi açık kalır. */
    .box {
      position: absolute;
      box-sizing: border-box;
      border: 2px solid #8b85ff;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .box.current { border-style: dashed; border-color: rgba(255, 255, 255, 0.7); }
  </style>
</head>
<body>
  <div class="help" id="help">
    <strong>Okunacak bölgeyi çizin</strong>
    Fareyle sürükleyin, örneğin altyazının çıktığı bant. Yalnızca bu alan okunur ve çevrilir.<br>
    <kbd>Esc</kbd> vazgeç · sağ tık: tüm ekran
    <div class="buttons">
      <button type="button" id="whole">Tüm ekranı oku</button>
      <button type="button" id="cancel">Vazgeç</button>
    </div>
  </div>
  <script src="region.js"></script>
</body>
</html>
