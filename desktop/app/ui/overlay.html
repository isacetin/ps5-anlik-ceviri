<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Anlık Çeviri overlay</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
    }

    .block {
      position: absolute;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.12em 0.35em;
      border-radius: 6px;
      background: rgba(10, 12, 16, 0.84);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <script src="overlay.js"></script>
</body>
</html>
