# Kurulum paketleri: TV uygulaması (APK) derlenir, masaüstü uygulamasına gömülür; Mac için .dmg,
# Windows için .exe kurulum dosyası üretilir. Uzun sürdüğü için elle ya da sürüm etiketiyle çalışır.
# Paketler henüz imzasızdır (Mac: Gatekeeper uyarısı, Windows: SmartScreen uyarısı).
name: Paketler

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  tv-apk:
    name: TV uygulaması (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: ./gradlew --no-daemon assembleRelease testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  desktop:
    name: Masaüstü (${{ matrix.name }})
    needs: tv-apk
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundles: app,dmg
            output: desktop/target/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            bundles: nsis
            output: desktop/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tv-apk
          path: app/build/outputs/apk/release
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Paketle
        working-directory: desktop/app
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: anlik-ceviri-${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error
